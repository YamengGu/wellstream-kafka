# Local stack: Kafka (KRaft, no ZooKeeper) + Schema Registry + TimescaleDB + Grafana + the three services.
#   make up        start everything
#   make replay    stream the F-1 C log into Kafka at 50x real time
x-app: &app
  build: .
  restart: unless-stopped
  environment:
    KAFKA_BOOTSTRAP: kafka:19092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    WAREHOUSE_DSN: postgresql://wellstream:wellstream@warehouse:5432/wellstream
    WELLSTREAM_DATA_DIR: /data
  volumes:
    - ./data:/data:ro
  depends_on:
    init:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 30

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects"]
      interval: 5s
      retries: 30

  warehouse:
    image: timescale/timescaledb:2.17.2-pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: wellstream
      POSTGRES_PASSWORD: wellstream
      POSTGRES_DB: wellstream
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellstream"]
      interval: 5s
      retries: 30

  # one-shot: create topics and warehouse schema
  init:
    build: .
    entrypoint: ["sh", "-c", "wellstream create-topics && wellstream init-db"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      WAREHOUSE_DSN: postgresql://wellstream:wellstream@warehouse:5432/wellstream
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      warehouse:
        condition: service_healthy

  validator:
    <<: *app
    command: ["validate"]

  detector:
    <<: *app
    command: ["detect"]

  sink:
    <<: *app
    command: ["sink"]

  # run on demand: docker compose run --rm replay --well F-1C --speedup 50
  replay:
    <<: *app
    restart: "no"
    command: ["replay", "--well", "F-1C", "--speedup", "50"]
    profiles: ["replay"]

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  warehouse-data:
