name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, unit and warehouse tests
    runs-on: ubuntu-latest
    services:
      warehouse:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: wellstream
          POSTGRES_PASSWORD: wellstream
          POSTGRES_DB: wellstream_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wellstream" --health-interval 5s --health-retries 20
    env:
      WELLSTREAM_TEST_PG_DSN: postgresql://wellstream:wellstream@localhost:5432/wellstream_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q -m "not kafka"

  kafka-integration:
    name: End-to-end on a real Kafka broker
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s --health-retries 30
      warehouse:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: wellstream
          POSTGRES_PASSWORD: wellstream
          POSTGRES_DB: wellstream_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wellstream" --health-interval 5s --health-retries 20
    env:
      WELLSTREAM_TEST_KAFKA: localhost:9092
      WELLSTREAM_TEST_PG_DSN: postgresql://wellstream:wellstream@localhost:5432/wellstream_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -v -m kafka

  docker:
    name: Compose file and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker build -t wellstream:ci .
      - run: docker run --rm wellstream:ci --help
